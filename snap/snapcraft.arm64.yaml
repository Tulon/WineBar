layout:
  /usr/share/fex-emu:
    symlink: $SNAP/usr/share/fex-emu
  /etc/OpenCL/vendors:
    bind: $SNAP/gpu-2404-override/etc/OpenCL/vendors
  /usr/share/drirc.d:
    symlink: $SNAP/gpu-2404-override/drirc.d
  /usr/share/libdrm:
    bind: $SNAP/gpu-2404-override/libdrm
  /usr/share/X11/XErrorDB:
    symlink: $SNAP/gpu-2404-override/X11/XErrorDB
  # The entries below we would set if we weren't mimicking what the `gpu-2404`
  # interface does. The reason we are mimicking it is that it's imposed on
  # us by the `gnome` extension. That interface exposes the folders listed
  # below via environment variables rather than placing them at well known
  # locations. We then modify those environment variables in
  # snap/command-chain/winebar-launcher by replacing `/gpu-2404/` with
  # `/gpu-2404-override/`. Should we make the folders listed below to appear
  # at well-known locations in addition to appearing in environment variables,
  # we may end up loading the same drivers twice. For instance, exposing
  # /usr/share/vulkan makes every GPU appear twice in the output of
  # gpu-enumerator (a utility that's part of WineBar).

  # /usr/share/glvnd:
  #   symlink: $SNAP/gpu-2404-override/usr/share/glvnd
  # /usr/share/vulkan:
  #   symlink: $SNAP/gpu-2404-override/usr/share/vulkan
  # /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gbm:
  #   symlink: $SNAP/gpu-2404-override/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gbm

apps:
  winebar:
    plugs:
      # muvm needs read-write access to /dev/kvm.
      - kvm

parts:
  # The only reason we build libxshmfence from source is that the version of
  # libxshmfence in Ubuntu 24.04 (1.3.1) doesn't include a certain patch [1]
  # that's needed to make graphics work in muvm. It's included in version
  # 1.3.3, but we decided to build the very next commit, which introduces
  # support for the meson build system. Building itself is done in the
  # libxshmfence-plus-mesa part.
  # [1]: https://gitlab.freedesktop.org/xorg/lib/libxshmfence/-/merge_requests/9
  libxshmfence-source:
    source: https://gitlab.freedesktop.org/xorg/lib/libxshmfence.git
    source-commit: 2c3d85cf655f4c9a605f0353cc742f186af52835
    plugin: nil
    override-pull: |
      craftctl default
      git am $CRAFT_PROJECT_DIR/snap/libxshmfence-patches/*

  # The reason we build mesa from source is that the version in Ubuntu 24.04
  # doesn't enable the Asahi driver. Building itself is done in the
  # libxshmfence-plus-mesa part.
  mesa-source:
    source: https://gitlab.freedesktop.org/mesa/mesa.git
    source-type: git
    source-tag: mesa-26.1.2
    plugin: nil
    override-pull: |
      craftctl default
      git am $CRAFT_PROJECT_DIR/snap/mesa-patches/*

  # This part builds libxshmfence and mesa from source.
  # Both native and cross-builds (for fex-rootfs) are done.
  libxshmfence-plus-mesa:
    after: [mesa-source, libxshmfence-source]
    plugin: nil
    override-build: |
      source $CRAFT_PROJECT_DIR/snap/scripts/buildah-helpers.sh

      # Remove any leftovers of the previous builds.
      buildah umount --all
      buildah rm --all
      buildah rmi --all

      #======================= Base image preparation ========================#

      # The base image is just a clean, updated Ubuntu installation.
      BASE_CON=$(buildah_from ubuntu:24.04)

      buildah config -e DEBIAN_FRONTEND=noninteractive \
        -e DEBCONF_NONINTERACTIVE_SEEN=true $BASE_CON
      buildah run $BASE_CON apt-get update

      buildah run $BASE_CON apt-get upgrade -yq
      buildah commit $BASE_CON base_image
      buildah rm $BASE_CON

      #===================== Native mesa tools build =========================#

      MESA_TOOLS_BUILDER_CON=$(buildah_from --name mesa_tools_builder base_image)

      # The tools will go to ./mesa-native-tools/bin
      rm -rf mesa-native-tools
      mkdir mesa-native-tools

      # Build mesa tools. The build writes to <MESA_SRC>/subprojects/packagecache,
      # hence we mount the mesa source directory as read-write. 
      buildah config --workingdir /work $MESA_TOOLS_BUILDER_CON
      buildah run \
        -v /root/parts/mesa-source/src:/usr/local/src/mesa:rw \
        -v $CRAFT_PART_BUILD/mesa-native-tools:/opt/mesa-native-tools:rw \
        -v $CRAFT_PROJECT_DIR/snap/scripts/build-native-mesa-tools.sh:/work/build.sh:ro \
        $MESA_TOOLS_BUILDER_CON /work/build.sh

      buildah rm $MESA_TOOLS_BUILDER_CON

      #========================== Native libs build ==========================#

      if true; then
        NATIVE_LIBS_BUILDER_CON=$(buildah_from --name native_libs_builder base_image)

        # Copy the mesa build tools (think mesa_clc) to /usr/bin
        buildah copy $NATIVE_LIBS_BUILDER_CON $CRAFT_PART_BUILD/mesa-native-tools /usr

        # The libs will go here.
        rm -rf mkdir $CRAFT_PART_INSTALL/gpu-2404-override
        mkdir -p $CRAFT_PART_INSTALL/gpu-2404-override

        # Build native libxshmfence and mesa libs. The build writes to
        # <MESA_SRC>/subprojects/packagecache, hence we mount the mesa source
        # directory as read-write.
        buildah run \
          -v /root/parts/mesa-source/src:/usr/local/src/mesa:rw \
          -v /root/parts/libxshmfence-source/src:/usr/local/src/libxshmfence:ro \
          -v $CRAFT_PART_INSTALL/gpu-2404-override:/opt/built-libs:rw \
          -v $CRAFT_PROJECT_DIR/snap/scripts/build-libxshmfence-and-mesa-libs.sh:/work/build.sh:ro \
          $NATIVE_LIBS_BUILDER_CON /work/build.sh --instdir /opt/built-libs

        buildah rm $NATIVE_LIBS_BUILDER_CON
      fi

      #========================== amd64 libs build ===========================#

      if true; then
        AMD64_LIBS_BUILDER_CON=$(buildah_from --name amd64_libs_builder base_image)

        # Copy the mesa build tools (think mesa_clc) to /usr/bin
        buildah copy $AMD64_LIBS_BUILDER_CON $CRAFT_PART_BUILD/mesa-native-tools /usr

        # The libs will go here.
        rm -rf mkdir $CRAFT_PART_INSTALL/libxshmfence-mesa-amd64
        mkdir -p $CRAFT_PART_INSTALL/libxshmfence-mesa-amd64

        # Build amd64 libxshmfence and mesa libs. The build writes to
        # <MESA_SRC>/subprojects/packagecache, hence we mount the mesa source
        # directory as read-write.
        buildah run \
          -v /root/parts/mesa-source/src:/usr/local/src/mesa:rw \
          -v /root/parts/libxshmfence-source/src:/usr/local/src/libxshmfence:ro \
          -v $CRAFT_PART_INSTALL/libxshmfence-mesa-amd64:/opt/built-libs:rw \
          -v $CRAFT_PROJECT_DIR/snap/cross-compile/meson-cross-amd64:/opt/meson-cross-file:ro \
          -v $CRAFT_PROJECT_DIR/snap/scripts/build-libxshmfence-and-mesa-libs.sh:/work/build.sh:ro \
          $AMD64_LIBS_BUILDER_CON /work/build.sh --instdir /opt/built-libs \
          --cross-arch amd64 --meson-cross-file /opt/meson-cross-file

        buildah rm $AMD64_LIBS_BUILDER_CON
      fi

      #=========================== i386 libs build ===========================#

      if true; then
        I386_LIBS_BUILDER_CON=$(buildah_from --name i386_libs_builder base_image)

        # Copy the mesa build tools (think mesa_clc) to /usr/bin
        buildah copy $I386_LIBS_BUILDER_CON $CRAFT_PART_BUILD/mesa-native-tools /usr

        # The libs will go here.
        rm -rf mkdir $CRAFT_PART_INSTALL/libxshmfence-mesa-i386
        mkdir -p $CRAFT_PART_INSTALL/libxshmfence-mesa-i386

        # Build i386 libxshmfence and mesa libs. The build writes to
        # <MESA_SRC>/subprojects/packagecache, hence we mount the mesa source
        # directory as read-write.
        buildah run \
          -v /root/parts/mesa-source/src:/usr/local/src/mesa:rw \
          -v /root/parts/libxshmfence-source/src:/usr/local/src/libxshmfence:ro \
          -v $CRAFT_PART_INSTALL/libxshmfence-mesa-i386:/opt/built-libs:rw \
          -v $CRAFT_PROJECT_DIR/snap/cross-compile/meson-cross-i386:/opt/meson-cross-file:ro \
          -v $CRAFT_PROJECT_DIR/snap/scripts/build-libxshmfence-and-mesa-libs.sh:/work/build.sh:ro \
          $I386_LIBS_BUILDER_CON /work/build.sh --instdir /opt/built-libs \
          --cross-arch i386 --meson-cross-file /opt/meson-cross-file

        buildah rm $I386_LIBS_BUILDER_CON
      fi

      #=======================================================================#

      # Cleanup
      buildah umount --all
      buildah rm --all
      buildah rmi --all

    build-packages:
      - buildah
      - crun
      - apparmor-utils

    organize:
      # We are mimicking what a gpu-2404 provider is supposed to do [1].
      # [1]: https://canonical.com/mir/docs/the-gpu-2404-snap-interface#heading--creating-a-provider-snap
      gpu-2404-override/usr/share/drirc.d: gpu-2404-override/drirc.d

    prime:
      - -gpu-2404-override/usr/bin
      - -gpu-2404-override/usr/include
      - -gpu-2404-override/usr/share/doc
      - -gpu-2404-override/usr/share/bug
      - -gpu-2404-override/usr/share/lintian
      - -gpu-2404-override/usr/share/man
      - -gpu-2404-override/usr/share/pkgconfig
      - -gpu-2404-override/usr/share/wayland-protocols
      - -gpu-2404-override/usr/lib/*/pkgconfig
      - -libxshmfence-mesa-*

  # It's tempting to bind-mount the $SNAP/gpu-2404-override over $SNAP/gpu-2404,
  # but then we would have to provide the gpu-2404-provider-wrapper script
  # under $SNAP/gpu-2404-override/bin, which we'd rather not. Besides, we would
  # be relying on the implementation detail where a layout entry overrides a
  # content provider at the same path.
  gpu-2404-override:
    plugin: nil
    stage-packages:
      # The list of packages below was mostly derived from:
      # https://canonical.com/mir/docs/the-gpu-2404-snap-interface#heading--lists

      # Graphics API
      - libgl1
      - libegl1
      - libgles2
      - libvulkan1
      #- libgbm1  # part of Mesa

      # DRM userspace
      - libdrm2
      - libdrm-common

      # Video Acceleration API
      - libva2
      - libva-drm2
      - libva-x11-2
      - libva-wayland2

      # Userspace drivers (excluded, as they are provided by mesa,
      # which we build ourselves from source).
      #- libgl1-mesa-dri
      #- va-driver-all
      #- vdpau-driver-all
      #- libvdpau-va-gl1
      #- mesa-vdpau-drivers
      #- mesa-vulkan-drivers
      #- libglx-mesa0

      # X11 support
      - libglx0
      - libx11-xcb1
      - libxau6
      - libxcb-dri2-0
      - libxcb-dri3-0
      - libxcb-present0
      - libxcb-sync1
      - libxcb-xfixes0
      - libxcb1
      - libxdamage1
      - libxdmcp6
      # - libxshmfence1  # We build this one from source.

      # Wayland support
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libwayland-server0

      # These are the runtime dependencies of the mesa libs that we build
      # from source.
      - libllvm20
      - libllvmspirvlib20.1
    organize:
      "*": gpu-2404-override

      # We have to mimic where gpu-2404 puts things.
      usr/share/libdrm: gpu-2404-override/libdrm
      usr/share/X11/XErrorDB: gpu-2404-override/X11/XErrorDB
    stage:
      - -gpu-2404-override/etc
      - -gpu-2404-override/usr/bin
      - -gpu-2404-override/usr/share/doc
      - -gpu-2404-override/usr/share/bug
      - -gpu-2404-override/usr/share/lintian
      - -gpu-2404-override/usr/share/man

      # Through dependencies, we still end up installing packages that we don't
      # want to install. For example, libglx0 depends on libglx-mesa0, which
      # we don't want to install, given that we build Mesa ourselves.
      # So, we end up removing the stuff they install manually.
      - -gpu-2404-override/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libEGL_mesa.*
      - -gpu-2404-override/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGLX_mesa.*
      - -gpu-2404-override/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri
      - -gpu-2404-override/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gbm
      - -gpu-2404-override/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgbm.*
      - -gpu-2404-override/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgallium-*
      - -gpu-2404-override/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libxshmfence.*
      - -gpu-2404-override/usr/share/drirc.d
      - -gpu-2404-override/usr/share/glvnd

  libkrunfw:
    source: https://github.com/containers/libkrunfw.git
    source-type: git
    source-tag: v5.3.0
    plugin: make
    make-parameters:
      - PREFIX=/usr
    build-environment:
      # The `gnome` extension imposes its own installation of python on us,
      # which doesn't see the python modules we've installed in build-packages.
      # The easiest workaround is to modify the PYTHONPATH environment variable.
      - PYTHONPATH: /usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}
    build-packages:
      - bc
      - cpio
      - flex
      - bison
      - python3
      - python3-pyelftools
    organize:
      usr/lib64: usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR

  # virglrenderer is used by libkrun to enable 3D acceleration inside muvm.
  # The version from Ubuntu repos won't do, as it doesn't enable support
  # for the Asahi driver.
  virglrenderer:
    source: https://gitlab.freedesktop.org/virgl/virglrenderer.git
    source-type: git
    source-tag: 1.3.0
    plugin: meson
    meson-parameters:
      - --buildtype=release
      - --prefix=/usr
      - -Db_ndebug=true
      - -Dstrip=true
      - -Dvenus=true
      - -Dvideo=true
      - -Ddrm-renderers=asahi,msm
    override-pull: |
      craftctl default

      # -Werror=pedantic breaks the build for us, so we comment it out.
      sed -i meson.build -e 's|\('\''-Werror=pedantic'\'',\)|# \1|'
    build-packages:
      - libepoxy-dev
      - python3
      - python3-yaml
    build-environment:
      # The `gnome` extension imposes its own installation of python on us,
      # which doesn't see the python modules we've installed in build-packages.
      # The easiest workaround is to modify the PYTHONPATH environment variable.
      - PYTHONPATH: /usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}
    prime:
      - -usr/bin
      - -usr/include
      - -usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig

  rust-deps:
    plugin: nil
    build-packages:
      - curl
    override-pull: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.0

  libkrun:
    after: [rust-deps, libkrunfw, virglrenderer]
    source: https://github.com/containers/libkrun.git
    source-type: git
    source-tag: v1.18.0
    plugin: make
    make-parameters:
      - PREFIX=/usr
      - GPU=1
      - VIRGL_RESOURCE_MAP2=1
      - BLK=1
      - NET=1
      - SND=1
    build-packages:
      - binutils
      - libc6-dev
      - libclang-dev
      - libcurl4-openssl-dev
      - libepoxy-dev
      - libdrm-dev
      - libpipewire-0.3-dev
      - libssl-dev
      - patch
      - patchelf
    build-environment:
      - PATH: /root/.cargo/bin:${PATH:+:$PATH}
    override-pull: |
      craftctl default
      git am $CRAFT_PROJECT_DIR/snap/libkrun-patches/*

      # We need some patches that are available from Fedora's SRPM repo.
      # As for the git sha1 to use, we take the head of the branch
      # for a particular Fedora release, then we take the libkrun
      # version to use from there. In other words, the source-tag
      # above is dictated by the git sha1 below, not the other way
      # around.
      rm -rf srpm
      git clone https://src.fedoraproject.org/rpms/libkrun.git srpm
      (cd srpm && git checkout f30eb433ae88db864e5b7ca72f4b15d27647963d)

      # Apply the patches
      patch -p1 -i srpm/libkrun-remove-unused-deps.diff 
      patch -p1 -i srpm/libkrun-remove-nitro-deps.diff
      patch -p1 -i srpm/libkrun-remove-tdx-deps.diff
      patch -p1 -i srpm/libkrun-bump-bzip-dep.diff
      patch -p1 -i srpm/libkrun-bump-kvm-bindings-dep.diff
      patch -p1 -i srpm/libkrun-bump-kvm-ioctls-dep.diff
      patch -p1 -i srpm/libkrun-remove-sev-deps.diff

      # Remove the SRPM checkout.
      rm -rf srpm
    organize:
      usr/lib64: usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    override-stage: |
      craftctl default

      # Snapcraft patches the .pc files during staging by prepending
      # $SNAPCRAFT_STAGE to the `prefix` variable. If `includedir`
      # and `libdir` were referencing `${prefix}`, that would have been
      # enough. In libkrun though, `includedir` and `libdir` are set
      # to an absolute path, which means we have to prepend
      # $SNAPCRAFT_STAGE to those variables ourselves.
      sed -i '$SNAPCRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig/libkrun.pc' \
        -e 's|^includedir=\(.*\)$|includedir=$SNAPCRAFT_STAGE\1|' \
        -e 's|^libdir=\(.*\)$|libdir=$SNAPCRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR|'
    prime:
      - -usr/include
      - -usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig

  muvm:
    after: [libkrun, rust-deps]
    source: https://github.com/AsahiLinux/muvm.git
    source-type: git
    source-tag: muvm-0.6.0
    plugin: rust
    rust-channel: none
    organize:
      muvm: /usr/bin/
      muvm-guest: /usr/bin/
    build-environment:
      # This will make the build process find libvirglrenderer.so
      # that muvm indirectly depends on through libkrun.so
      - LD_LIBRARY_PATH: $SNAPCRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
    build-packages:
      - libudev-dev
    stage-packages:
      - passt
      - socat
    override-pull: |
      craftctl default
      git am $CRAFT_PROJECT_DIR/snap/muvm-patches/*
    prime:
      - -usr/share/doc

  # Note that muvm drops its own FEX-EMU Config.json to /usr/share/fex-emu/ in
  # its own virtual filesystem. Within a Snap confined environment, it's not
  # possible to run FEX-EMU without muvm. The Generic-ARM64-support.md document
  # at the root of this repo explains why. Therefore, we don't ship our own
  # Config.json file.
  fex-emu:
    plugin: cmake
    source: https://github.com/FEX-Emu/FEX.git
    source-type: git
    source-tag: FEX-2605
    cmake-generator: Ninja
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_C_COMPILER=clang
      - -DCMAKE_CXX_COMPILER=clang++
      - -DUSE_LINKER=lld
      - -DENABLE_LTO=ON
      - -DBUILD_TESTING=OFF
      - -DENABLE_ASSERTIONS=OFF
      - -DBUILD_THUNKS=ON
      - -DENABLE_CLANG_THUNKS=ON
      - -DBUILD_FEXCONFIG=OFF
      - -DENABLE_OFFLINE_TELEMETRY=OFF

      # The defaults are to target the processor we are building on, which
      # leads to SIGILL when trying to run FEX on older architectures. The
      # below settings were taken from [1]. For possible values, refer to [2].
      # [1]: https://github.com/FEX-Emu/FEX/blob/FEX-2603/.gitlab-ci.yml
      # [2]: https://gcc.gnu.org/onlinedocs/gcc/AArch64-Options.html
      - -DTUNE_ARCH=armv8.2-a
      - -DTUNE_CPU=none

      # Judging by the source code, FEX-EMU integrates with Proton rather than
      # Steam itsef and it does have fallback paths, yet we can't enable this
      # option, as then FEX-EMU is not able to find the Config.json file that
      # muvm puts to /usr/share/fex-emu/.
      - -DBUILD_STEAM_SUPPORT=OFF
    build-packages:
      - clang
      - llvm-dev
      - lld
      - binfmt-support
      - libc6-dev-amd64-cross
      - libc6-dev-i386-cross
      - libstdc++-13-dev-amd64-cross
      - libstdc++-13-dev-i386-cross
      - libasound2-dev
    prime:
      - -usr/include
      - -usr/share/man

  # When building fex-rootfs on arm64, we need to run amd64 / i386 binaries.
  # That can be done with the qemu-user-static package.
  #
  # The easiest approach would be to run one of those docker / podman images
  # that ship the qemu-user-static executables and register them as binfmt_misc
  # handlers. [1] is one such image that supports ARM64 hosts. Unfortunately,
  # I couldn't get it to work inside snapcraft. It seems to run fine but that
  # doesn't seem to have any effect.
  #
  # So, we end up doing everything manually. What doesn't help though is the
  # fact that the qemu-user-static package in Ubuntu 24.04 is affected by [2].
  # Fortunately, being static executables, they are easy to source from any
  # distro that has them, which is what we do below.
  #
  # [1]: https://github.com/linuxserver/docker-qemu-static
  # [2]: https://gitlab.com/qemu-project/qemu/-/issues/2168
  qemu-user-static:
    plugin: nil
    override-build: |
      source $CRAFT_PROJECT_DIR/snap/scripts/buildah-helpers.sh

      # Remove any leftovers of the previous failed builds.
      buildah umount --all
      buildah rm --all
      buildah rmi --all

      QEMU_CON=$(buildah_from fedora:44)
      buildah run $QEMU_CON dnf install -y qemu-user-static
      QEMU_MOUNT=$(buildah mount $QEMU_CON)

      install -D -t $CRAFT_PART_INSTALL/qemu-user-static \
        $QEMU_MOUNT/usr/bin/qemu-i386-static \
        $QEMU_MOUNT/usr/bin/qemu-x86_64-static

      buildah umount $QEMU_CON
      buildah rm $QEMU_CON

    build-packages:
      - buildah
      - crun
      - apparmor-utils
    prime:
      - -qemu-user-static

  fex-rootfs:
    after: [qemu-user-static, libxshmfence-plus-mesa]
    plugin: nil
    stage-packages:
      # To be able to unpack the default.erofs file on systems where we don't
      # use muvm.
      - erofs-utils
    build-packages:
      - erofs-utils
      - buildah
      - crun
      - apparmor-utils
    override-build: |
      # This sets up emulation in order to be able to run x86 and x86_64
      # binaries, which is needed by build-fex-rootfs-image.sh.
      # This happens to work even locally on Asahi Linux, even though
      # there is a page size mismatch. That's just luck however, that
      # tools like apt and dpkg don't mind a larger page size. When I
      # tried to make a build of mesa under emulation, the mesa_clc
      # executable was crashing due to a page size mismatch.
      $CRAFT_PROJECT_DIR/snap/scripts/setup-x86-emulation.sh \
        --bindir $CRAFT_STAGE/qemu-user-static

      source $CRAFT_PROJECT_DIR/snap/scripts/buildah-helpers.sh

      # Remove any leftovers of the previous builds.
      buildah umount --all
      buildah rm --all
      buildah rmi --all

      FEX_ROOTFS_CON=$(buildah_from --name fex_rootfs --arch x86_64 ubuntu:24.04)

      buildah config --workingdir /work -e DEBIAN_FRONTEND=noninteractive \
        -e DEBCONF_NONINTERACTIVE_SEEN=true $FEX_ROOTFS_CON

      buildah run \
        -v $CRAFT_PROJECT_DIR/snap/scripts/build-fex-rootfs-image.sh:/work/build.sh:ro \
        $FEX_ROOTFS_CON /work/build.sh

      FEX_ROOTFS_MOUNT=$(buildah mount $FEX_ROOTFS_CON)

      # Remove the working directory.
      rm -rf $FEX_ROOTFS_MOUNT/work

      # Remove all traces of mesa and libxshmfence, as we build them
      # from source.
      for arch_triplet in x86_64-linux-gnu i386-linux-gnu; do
        rm -rf $FEX_ROOTFS_MOUNT/usr/lib/$arch_triplet/{dri,gbm}
        rm -rf $FEX_ROOTFS_MOUNT/usr/lib/$arch_triplet/libRusticlOpenCL.*
        rm -rf $FEX_ROOTFS_MOUNT/usr/lib/$arch_triplet/libvulkan_*
        rm -rf $FEX_ROOTFS_MOUNT/usr/lib/$arch_triplet/libVkLayer_MESA*
        rm -rf $FEX_ROOTFS_MOUNT/usr/lib/$arch_triplet/libEGL_mesa.*
        rm -rf $FEX_ROOTFS_MOUNT/usr/lib/$arch_triplet/libgallium-*
        rm -rf $FEX_ROOTFS_MOUNT/usr/lib/$arch_triplet/libgbm.*
        rm -rf $FEX_ROOTFS_MOUNT/usr/lib/$arch_triplet/libGLX_mesa.*
        rm -rf $FEX_ROOTFS_MOUNT/usr/lib/$arch_triplet/libxshmfence.*
      done

      # Copy mesa and libxshmfence we've built from source.
      cp -a $CRAFT_STAGE/libxshmfence-mesa-amd64/. $FEX_ROOTFS_MOUNT
      cp -a $CRAFT_STAGE/libxshmfence-mesa-i386/. $FEX_ROOTFS_MOUNT

      # Remove files under /usr/sbin
      find $FEX_ROOTFS_MOUNT/usr/sbin -mindepth 1 -delete

      # TODO: think about removing files under /usr/bin as well.
      # That breaks FEXBash, though it's only needed for debugging.

      # Make the rootfs image.
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/fex-emu/RootFS"
      mkfs.erofs --quiet "$CRAFT_PART_INSTALL/usr/share/fex-emu/RootFS/default.erofs" $FEX_ROOTFS_MOUNT

      # Cleanup.
      buildah umount $FEX_ROOTFS_CON
      buildah rm $FEX_ROOTFS_CON
      buildah rmi --all
